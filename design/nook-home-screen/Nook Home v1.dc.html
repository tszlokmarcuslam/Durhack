<x-dc>

<div ref="{{ rootRef }}" data-screen-label="Home" style="position:relative;width:100%;height:100vh;min-height:520px;overflow:hidden;font-family:'Fredoka',ui-rounded,system-ui,sans-serif;color:#3B2A20;background:radial-gradient(circle at 42% 45%,#9FE8DA 0,#4CC3CF 22%,#2E9CC0 60%,#2488B8 100%)">

      </div>
      <button type="button" onMouseEnter="{{ waveOn }}" onMouseLeave="{{ waveOff }}" style="height:56px;padding:0 24px 0 20px;display:flex;align-items:center;gap:10px;border:none;cursor:pointer;background:#E6D6F8;color:#3B2A20;border-radius:999px;box-shadow:0 8px 22px rgba(20,70,90,.2);font:600 18px 'Fredoka',sans-serif;transition:transform .18s cubic-bezier(.3,1.5,.5,1)" style-hover="transform:translateY(-2px)" style-active="transform:translateY(1px) scale(.98)">

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="3.6"></circle><path d="M12 3v2.2M12 18.8V21M3 12h2.2M18.8 12H21M5.6 5.6l1.6 1.6M16.8 16.8l1.6 1.6M5.6 18.4l1.6-1.6M16.8 7.2l1.6-1.6"></path></svg>
      </button>

      <span style="width:48px;height:48px;border-radius:50%;background:rgba(255,251,242,.75);display:flex;align-items:center;justify-content:center;flex:none">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="12" height="11" rx="3"></rect><path d="M15 10.5l5-3v9l-5-3"></path></svg>
      </span>
      <span style="flex:1">Call</span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="opacity:.45"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
    <button type="button" style="height:clamp(60px,11vh,78px);padding:0 22px 0 15px;display:flex;align-items:center;gap:16px;border:none;cursor:pointer;background:#FFFBF2;color:#3B2A20;border-radius:28px;box-shadow:inset 0 -4px 0 rgba(59,42,32,.06),0 12px 28px rgba(20,70,90,.26);font:600 25px 'Fredoka',sans-serif;text-align:left;transition:transform .2s cubic-bezier(.3,1.5,.5,1),box-shadow .2s" style-hover="transform:translateY(-3px);box-shadow:inset 0 -4px 0 rgba(59,42,32,.06),0 18px 34px rgba(20,70,90,.3)" style-active="transform:translateY(2px) scale(.985)">

        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"></path></svg>

    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3"></path><path d="M18 3v4h-4M6 21v-4h4"></path></svg>
    <span>Drag to look around</span>
  </div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;timeOfDay&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Day&quot;,&quot;Golden hour&quot;,&quot;Night&quot;],&quot;default&quot;:&quot;Day&quot;,&quot;tsType&quot;:&quot;'Day'|'Golden hour'|'Night'&quot;,&quot;section&quot;:&quot;World&quot;},&quot;droneOrbit&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;World&quot;},&quot;cardigan&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#6F7F3A&quot;,&quot;options&quot;:[&quot;#6F7F3A&quot;,&quot;#5C7FA3&quot;,&quot;#C96A4A&quot;,&quot;#D9A441&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Character&quot;}}">
class Component extends DCLogic {
  state = { tod: null };
  rootRef = React.createRef(); islandRef = React.createRef(); charRef = React.createRef(); avatarRef = React.createRef();
  wave = false; orbit = 0.55; mx = 0; my = 0;

  tod() { return this.state.tod || this.props.timeOfDay || 'Day'; }
  componentDidMount() {
    this.alive = true;
    import('https://unpkg.com/three@0.184.0/build/three.module.js').then(T => { if (this.alive) this.start(T); });
  }
  componentDidUpdate(pp) {
    if (pp.timeOfDay !== this.props.timeOfDay && this.state.tod) this.setState({ tod: null });
    if (this.applyLook) this.applyLook();
  }
  componentWillUnmount() {
    this.alive = false; cancelAnimationFrame(this.raf);
    if (this.ro) this.ro.disconnect();
    if (this.off) this.off();
    (this.renderers || []).forEach(r => r.dispose());
  }

  start(T) {
    const root = this.rootRef.current, cvI = this.islandRef.current, cvC = this.charRef.current;
    if (!root || !cvI || !cvC) return;
    const PI = Math.PI, sin = Math.sin, cos = Math.cos;
    let seed = 11;
    const rng = () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const mats = {};
    const M = (c, o) => { const k = c + (o ? JSON.stringify(o) : ''); return mats[k] || (mats[k] = new T.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.95 }, o))); };
    const SPH = new T.SphereGeometry(1, 24, 16), CYL = new T.CylinderGeometry(1, 1, 1, 18), BOX = new T.BoxGeometry(1, 1, 1), CONE = new T.ConeGeometry(1, 1, 18);
    const P = (par, g, mat, p, s, r) => { const me = new T.Mesh(g, mat); me.position.set(p[0], p[1], p[2]); if (s != null) Array.isArray(s) ? me.scale.set(s[0], s[1], s[2]) : me.scale.setScalar(s); if (r) me.rotation.set(r[0], r[1], r[2]); me.castShadow = me.receiveShadow = true; par.add(me); return me; };
    const G3 = (par, x, y, z, s) => { const g = new T.Group(); g.position.set(x, y, z); if (s) g.scale.setScalar(s); par.add(g); return g; };

    /* ---------- island world ---------- */
    const scene = new T.Scene();
    const R = 11, GY = 1.05, SY = 0.4;
    const rAt = a => 1 + 0.11 * sin(2 * a + 1) + 0.07 * sin(3 * a + 2.4) + 0.04 * sin(5 * a + 0.3);
    const blob = s => { const sh = new T.Shape(); for (let i = 0; i <= 140; i++) { const a = i / 140 * PI * 2, r = R * s * rAt(a), x = r * cos(a), y = -r * sin(a); i ? sh.lineTo(x, y) : sh.moveTo(x, y); } return sh; };
    const flat = g => { g.rotateX(-PI / 2); return g; };
    const grassEdge = a => R * 0.76 * rAt(a) + 0.3, sandR = a => R * rAt(a) * 0.9;
    const groundY = (x, z) => { const hx = (x + 4.2) / 4.6, hz = (z + 3.2) / 4.2, q = 1 - hx * hx - hz * hz; return q > 0 ? Math.max(GY, GY - 0.05 + 2.3 * Math.sqrt(q)) : GY; };
    const surfY = (x, z) => Math.hypot(x, z) < grassEdge(Math.atan2(z, x)) - 0.15 ? groundY(x, z) : SY;

    // water
    const wc = document.createElement('canvas'); wc.width = wc.height = 1024;
    const wx = wc.getContext('2d'), wg = wx.createRadialGradient(512, 512, 0, 512, 512, 512);
    [[0, '#86DDD0'], [0.05, '#6CD2CE'], [0.085, '#41B9C8'], [0.16, '#2C9DC0'], [0.4, '#2389B6'], [1, '#1D78A8']].forEach(s => wg.addColorStop(s[0], s[1]));
    wx.fillStyle = wg; wx.fillRect(0, 0, 1024, 1024);
    const wt = new T.CanvasTexture(wc); wt.colorSpace = T.SRGBColorSpace;
    const waterMat = new T.MeshStandardMaterial({ map: wt, roughness: 1 });
    const water = new T.Mesh(flat(new T.CircleGeometry(300, 72)), waterMat); water.receiveShadow = true; scene.add(water);
    const ring = (s, col, op, y) => { const me = new T.Mesh(flat(new T.ShapeGeometry(blob(s))), new T.MeshStandardMaterial({ color: col, transparent: true, opacity: op, roughness: 1, depthWrite: false })); me.position.y = y; me.receiveShadow = true; scene.add(me); return me; };
    ring(1.42, '#C9F5E6', 0.16, 0.01); ring(1.22, '#D8FAEC', 0.3, 0.02);
    const foam = ring(1.07, '#FFFFFF', 0.85, 0.03);

    // land
    const isl = new T.Group(); scene.add(isl);
    const sand = M('#F6E2B3'), grass = M('#8ECC74'), grass2 = M('#7DBF6C');
    const sandMesh = P(isl, flat(new T.ExtrudeGeometry(blob(1), { depth: 0.5, bevelEnabled: true, bevelThickness: 0.35, bevelSize: 0.6, bevelSegments: 5 })), sand, [0, -0.45, 0]); sandMesh.castShadow = false;
    P(isl, flat(new T.ExtrudeGeometry(blob(0.76), { depth: 0.4, bevelEnabled: true, bevelThickness: 0.3, bevelSize: 0.4, bevelSegments: 5 })), grass, [0, 0.35, 0]);
    P(isl, new T.SphereGeometry(1, 40, 16, 0, PI * 2, 0, PI / 2), grass2, [-4.2, GY - 0.05, -3.2], [4.6, 2.3, 4.2]);
    [[4.6, 4.6, 1.9], [-1.5, 5.2, 1.5], [6.2, -1.2, 1.2], [-6.4, 2.4, 1.3]].forEach(c => { const me = P(isl, CYL, M('#9BD57C'), [c[0], GY + 0.005, c[1]], [c[2], 0.01, c[2] * 0.8]); me.castShadow = false; });

    // house
    const house = G3(isl, 2.2, GY, -0.8); house.rotation.y = 0.3;
    const wall = M('#FFF3DC'), roof = M('#DB6E50'), wood = M('#8A5A3C'), stone = M('#DCD0C0'), white = M('#FFFDF6');
    const winMat = new T.MeshStandardMaterial({ color: '#BFE6F2', emissive: '#FFC766', emissiveIntensity: 0, roughness: 0.5 });
    P(house, BOX, stone, [0, 0.1, 0], [4.4, 0.2, 3.4]);
    P(house, BOX, wall, [0, 1.2, 0], [4, 2, 3]);
    const tri = new T.Shape(); tri.moveTo(-1.5, 0); tri.lineTo(1.5, 0); tri.lineTo(0, 1.3); tri.closePath();
    const gab = new T.ExtrudeGeometry(tri, { depth: 4, bevelEnabled: false }); gab.translate(0, 0, -2);
    P(house, gab, wall, [0, 2.2, 0], null, [0, PI / 2, 0]);
    const ang = Math.atan2(1.3, 1.5), L = 2.5;
    [1, -1].forEach(s => P(house, BOX, roof, [0, 3.59 - sin(ang) * (L / 2 - 0.12), s * cos(ang) * (L / 2 - 0.12)], [4.8, 0.2, L], [s * ang, 0, 0]));
    P(house, CYL, M('#C65C42'), [0, 3.62, 0], [0.15, 4.8, 0.15], [0, 0, PI / 2]);
    P(house, BOX, M('#CFA88E'), [1.2, 3.3, -0.7], [0.5, 1.3, 0.5]); P(house, BOX, stone, [1.2, 3.98, -0.7], [0.66, 0.12, 0.66]);
    P(house, BOX, M('#6F7F3A'), [-0.7, 0.92, 1.52], [0.78, 1.44, 0.08]); P(house, SPH, M('#FFE39A'), [-0.45, 0.9, 1.58], 0.05);
    P(house, BOX, stone, [-0.7, 0.08, 1.95], [1.3, 0.16, 0.7]);
    P(house, BOX, roof, [-0.7, 1.86, 1.82], [1.25, 0.1, 0.75], [0.35, 0, 0]);
    const win = (x, y, z, ry) => { const g = G3(house, x, y, z); g.rotation.y = ry; P(g, BOX, white, [0, 0, 0], [0.9, 0.9, 0.06]); P(g, BOX, winMat, [0, 0, 0.02], [0.7, 0.7, 0.06]); P(g, BOX, white, [0, 0, 0.04], [0.06, 0.7, 0.05]); P(g, BOX, white, [0, 0, 0.04], [0.7, 0.06, 0.05]); };
    win(0.9, 1.3, 1.5, 0); win(-0.9, 1.3, -1.5, PI); win(0.9, 1.3, -1.5, PI); win(2, 1.3, 0, PI / 2); win(-2, 1.3, 0, -PI / 2);
    [2.01, -2.01].forEach(x => P(house, CYL, winMat, [x, 2.7, 0], [0.26, 0.05, 0.26], [0, 0, PI / 2]));
    P(house, BOX, wood, [0.9, 0.76, 1.62], [0.95, 0.16, 0.22]);
    const petals = ['#F58FA6', '#FFFFFF', '#FFD166', '#F58FA6', '#C9A5F2'];
    petals.forEach((c, i) => P(house, SPH, M(c), [0.52 + i * 0.19, 0.9, 1.64], 0.09));
    const lamp = new T.PointLight('#FFB45C', 0, 14, 1.6); lamp.position.set(-0.7, 1.5, 2.6); house.add(lamp);
    scene.updateMatrixWorld(true);
    const door = house.localToWorld(new T.Vector3(-0.7, 0, 2.7)), chim = house.localToWorld(new T.Vector3(1.2, 3.1, -0.7));

    // dock + boat
    const fd = 1.0, dock = G3(isl, cos(fd) * 9.3, 0, sin(fd) * 9.3); dock.rotation.y = -fd;
    const pl = [M('#C99A6B'), M('#BC8C5E')];
    for (let i = 0; i < 11; i++) P(dock, BOX, pl[i % 2], [i * 0.55, 0.52, 0], [0.49, 0.1, i > 8 ? 2.8 : 1.5]);
    [[1.4, 0.72], [1.4, -0.72], [3.6, 0.72], [3.6, -0.72], [5.6, 1.35], [5.6, -1.35]].forEach(p => P(dock, CYL, wood, [p[0], 0.25, p[1]], [0.09, 1.1, 0.09]));
    const boat = G3(dock, 3.2, 0.1, 1.9);
    P(boat, SPH, M('#E8795A'), [0, 0, 0], [1.25, 0.42, 0.58]); P(boat, SPH, wall, [0, 0.14, 0], [1.05, 0.3, 0.44]); P(boat, BOX, wood, [0, 0.36, 0], [0.16, 0.05, 0.8]);

    // stepping-stone path
    const taken = [{ x: 2.2, z: -0.8, r: 3.3 }, { x: 6, z: -4.3, r: 1.5 }, { x: -2.2, z: 1.2, r: 1.5 }, { x: 5.2, z: 2.8, r: 1.2 }];
    const pe = [cos(fd) * 9.0, sin(fd) * 9.0], pc = [door.x + 0.2, door.z + 3.4];
    for (let i = 0; i <= 13; i++) { const t = i / 13, u = 1 - t, x = u * u * door.x + 2 * u * t * pc[0] + t * t * pe[0], z = u * u * door.z + 2 * u * t * pc[1] + t * t * pe[1]; const me = P(isl, CYL, stone, [x, surfY(x, z) + 0.03, z], [0.36, 0.08, 0.3], [0, rng() * 3, 0]); me.castShadow = false; taken.push({ x, z, r: 0.7 }); }

    // pond, veggie patch, picnic
    const pond = P(isl, CYL, M('#86DCE4', { roughness: 0.3 }), [6, GY + 0.02, -4.3], [1.2, 0.04, 0.95]); pond.castShadow = false;
    const rock = M('#B4B9B2', { flatShading: true }), ICO = new T.IcosahedronGeometry(1, 0);
    for (let i = 0; i < 9; i++) { const a = i / 9 * PI * 2 + 0.2; P(isl, ICO, rock, [6 + cos(a) * 1.3, GY + 0.08, -4.3 + sin(a) * 1.05], 0.16 + rng() * 0.14, [rng(), rng(), 0]); }
    P(isl, CYL, M('#6FB36B'), [5.7, GY + 0.05, -4.1], [0.22, 0.02, 0.22]); P(isl, CYL, M('#6FB36B'), [6.4, GY + 0.05, -4.6], [0.17, 0.02, 0.17]); P(isl, SPH, M('#F58FA6'), [5.7, GY + 0.09, -4.1], 0.07);
    P(isl, BOX, M('#9A6B4A'), [-2.2, GY + 0.05, 1.2], [2.2, 0.12, 1.5]);
    for (let i = 0; i < 5; i++) for (let j = 0; j < 3; j++) P(isl, SPH, M(j === 1 && i % 2 ? '#F0853F' : '#5FA85E'), [-3 + i * 0.4, GY + 0.17, 0.75 + j * 0.45], [0.14, 0.12, 0.14]);
    const blanket = P(isl, BOX, M('#F29C86'), [5.2, GY + 0.02, 2.8], [1.5, 0.03, 1.5], [0, 0.5, 0]); blanket.castShadow = false;
    P(isl, BOX, white, [5.2, GY + 0.03, 2.8], [1.5, 0.03, 0.3], [0, 0.5, 0]).castShadow = false;
    P(isl, BOX, M('#C99A6B'), [5.45, GY + 0.16, 2.6], [0.4, 0.26, 0.3], [0, 0.5, 0]);

    // trees
    const trunk = M('#8A5A3C'), greens = [M('#6FB36B'), M('#5CA568'), M('#84C46C')], pineM = [M('#3F8F6B'), M('#4B9B74')];
    const tree = (x, z, s) => { const g = G3(isl, x, surfY(x, z), z, s), c = greens[Math.floor(rng() * 3)], c2 = greens[Math.floor(rng() * 3)]; P(g, CYL, trunk, [0, 0.45, 0], [0.13, 0.9, 0.13]); P(g, SPH, c, [0, 1.35, 0], 0.8); P(g, SPH, c2, [0.45, 1.05, 0.2], 0.5); P(g, SPH, c2, [-0.4, 1.15, -0.25], 0.55); P(g, SPH, c, [0.1, 1.9, 0.1], 0.5); };
